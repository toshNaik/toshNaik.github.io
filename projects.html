---
layout: default
title: Projects
active: projects
---
{% assign sorted = site.projects | reverse %}
<div class="list_container">
    {% for project in sorted %}
    <div class="list_item">
        <a class="list_item_link" href={{ project.link }} target="_blank">
            <img src={{ project.img_path }} class="" alt="...">
            <section class="list_item_description_container">
                <h3>{{ project.title }}</h3>
                <!-- <p class="list_item_description">
                {{ project.content | markdownify }}
                </p> -->
            </section>
        </a>
    </div>
    {% endfor %}
</div>

<script>
    function reorderArray(arrayElements) {
        var out = []
        out.length = arrayElements.length

        let idx = 0
        for (let i=0; i<arrayElements.length; i+=3) {
            out[idx++] = arrayElements[i]
        }
        for (let i=1; i<arrayElements.length; i+=3) {
            out[idx++] = arrayElements[i]
        }
        for (let i=2; i<arrayElements.length; i+=3) {
            out[idx++] = arrayElements[i]
        }
        return out
    }

    const projectItems = document.getElementsByClassName("list_item")
    const projectArray = Array.from(projectItems)
    const updatedArray = reorderArray(projectArray)

    const parentDiv = projectArray[0].parentElement
    parentDiv.replaceChildren(...updatedArray)
</script>
